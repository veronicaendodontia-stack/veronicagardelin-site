<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diário de Consultório — ambiente de testes</title>
<style>
:root{--olive:#839c83;--ink:#3d5143;--cream:#f5f3ee;--mist:#eff5ed}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:Avenir,"Avenir Next",Arial,sans-serif}header{padding:28px 6%;border-bottom:1px solid #e5e5e1;display:flex;align-items:center;justify-content:space-between;gap:20px}header a{color:var(--ink);text-decoration:none;font-size:14px}header strong{font-weight:500;letter-spacing:.02em}main{max-width:1050px;margin:auto;padding:70px 24px 100px}h1{color:#7c9480;font-family:Avenir,'Avenir Next',-apple-system,BlinkMacSystemFont,Arial,sans-serif;font-weight:500;font-size:clamp(34px,5vw,54px);text-align:center;margin:0 0 44px}.categories{display:flex;justify-content:center;gap:clamp(18px,6vw,80px);flex-wrap:wrap;margin-bottom:52px}.category{background:transparent;border:0;cursor:pointer;padding:4px;color:var(--ink)}.symbol{display:grid;place-items:center;width:86px;height:86px;border-radius:50%;font-family:Avenir,'Avenir Next',-apple-system,BlinkMacSystemFont,Arial,sans-serif;font-size:36px;background:var(--mist);transition:transform .2s,outline .2s}.category:nth-child(2) .symbol{background:#e1e4de}.category:nth-child(3) .symbol{background:var(--cream)}.category[aria-pressed=true] .symbol{outline:2px solid var(--olive);outline-offset:5px;transform:scale(1.04)}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{border:0;background:var(--cream);aspect-ratio:1;overflow:hidden;cursor:pointer;padding:0;color:var(--ink);font:inherit;text-align:left}.tile img{width:100%;height:100%;object-fit:cover}.tile .quote{padding:18px;display:grid;place-items:center;height:100%;font-family:Avenir,'Avenir Next',-apple-system,BlinkMacSystemFont,Arial,sans-serif;font-weight:400;color:#7c9480;font-size:clamp(14px,2vw,23px);text-align:center;line-height:1.5}.empty{text-align:center;color:#7c9480;padding:56px 12px;grid-column:1/-1}dialog{border:0;border-radius:5px;padding:0;max-width:min(90vw,700px);width:100%;box-shadow:0 15px 80px #0004}dialog::backdrop{background:#1b211db8}.detail{padding:24px}.detail img{width:100%;max-height:60vh;object-fit:contain}.detail p{white-space:pre-wrap;line-height:1.7}.close{float:right;background:none;border:0;font-size:27px;cursor:pointer}footer{text-align:center;padding:35px;color:#7c9480;font-size:12px}@media(max-width:600px){header{padding:18px 16px}header strong{font-size:13px}header a{font-size:12px}main{padding:42px 16px 72px}h1{font-size:clamp(28px,8vw,38px);margin-bottom:34px}.gallery{gap:5px}.symbol{width:68px;height:68px;font-size:30px}.categories{gap:24px}.tile .quote{padding:8px;font-size:13px}dialog{max-width:calc(100vw - 24px);max-height:calc(100dvh - 32px);overflow:auto}.detail{padding:16px}.detail img{max-height:50dvh}.close{min-width:44px;min-height:44px}}</style>
</head><body><header><strong>Dra. Verônica Gardelin</strong><a href="./index.html">Voltar ao site</a></header>
<main><h1>Diário de Consultório</h1><nav class="categories" aria-label="Categorias">
<button class="category" data-category="casos" aria-pressed="false" aria-label="Casos clínicos" title="Casos clínicos"><span class="symbol">✧</span></button>
<button class="category" data-category="bastidores" aria-pressed="false" aria-label="Bastidores" title="Bastidores"><span class="symbol">☕</span></button>
<button class="category" data-category="reflexoes" aria-pressed="false" aria-label="Reflexões" title="Reflexões"><span class="symbol">✎</span></button>
</nav><section id="gallery" class="gallery" aria-live="polite"><p class="empty">Carregando publicações...</p></section></main>
<dialog id="post"><div class="detail"><button class="close" aria-label="Fechar publicação">×</button><div id="post-content"></div></div></dialog>
<footer>Ambiente de testes — nenhuma alteração no site publicado</footer>
<script>
const gallery=document.querySelector('#gallery'),dialog=document.querySelector('#post'),postContent=document.querySelector('#post-content');
let posts=[],selected=null;
function render(){document.querySelectorAll('.category').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.category===selected)));gallery.replaceChildren();const visible=posts.filter(p=>p.publicado===true&&(!selected||p.categoria===selected));if(!visible.length){const p=document.createElement('p');p.className='empty';p.textContent='Em breve, novas histórias por aqui.';gallery.append(p);return}for(const p of visible){const b=document.createElement('button');b.className='tile';b.setAttribute('aria-label','Abrir publicação');if(p.fotografia){const img=document.createElement('img');img.src=p.fotografia;img.alt='Fotografia da publicação';img.loading='lazy';img.decoding='async';b.append(img)}else{const d=document.createElement('div');d.className='quote';d.textContent=p.legenda.slice(0,140);b.append(d)}b.addEventListener('click',()=>openPost(p));gallery.append(b)}}
function openPost(p){postContent.replaceChildren();if(p.fotografia){const img=document.createElement('img');img.src=p.fotografia;img.alt='Fotografia da publicação';postContent.append(img)}const text=document.createElement('p');text.textContent=p.legenda;postContent.append(text);dialog.showModal();document.body.style.overflow='hidden'}
document.querySelectorAll('.category').forEach(b=>b.addEventListener('click',()=>{selected=selected===b.dataset.category?null:b.dataset.category;render()}));document.querySelector('.close').addEventListener('click',()=>dialog.close());dialog.addEventListener('close',()=>{document.body.style.overflow=''});dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
fetch('./diario/publicacoes.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Não foi possível carregar');return r.json()}).then(data=>{posts=Array.isArray(data)?data:[];render()}).catch(()=>{gallery.textContent='Não foi possível carregar as publicações.'});
</script></body></html>
