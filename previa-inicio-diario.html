<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste integrado — Diário de Consultório</title><style>html,body{margin:0;height:100%;background:#fff;font-family:Avenir,"Avenir Next",Arial,sans-serif}.status{background:#f1f4ef;color:#617264;text-align:center;font-size:12px;padding:10px}.frame{width:100%;height:calc(100vh - 36px);border:0;display:block}</style></head><body><div class="status">PRÉVIA INTEGRADA • site oficial preservado</div><iframe id="site" class="frame" src="/" title="Site com Diário de Consultório"></iframe><script>
const frame=document.getElementById('site');
frame.addEventListener('load',()=>{
try{
const d=frame.contentDocument;if(!d||d.getElementById('diario-home-preview'))return;
const style=d.createElement('style');style.textContent=`
#diario-home-preview{padding:55px 18px 65px;text-align:center;background:#fff;font-family:Avenir,"Avenir Next",Arial,sans-serif;color:#667968}
#diario-home-preview h2{font-weight:500;color:#7c9480;font-size:clamp(26px,4vw,36px);margin:0 0 34px}
#diario-home-preview .diary-icons{display:flex;justify-content:center;gap:clamp(12px,4vw,48px);max-width:690px;margin:auto}
#diario-home-preview .diary-icon{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:#6b786d;cursor:pointer;font-size:clamp(12px,2.6vw,16px)}
#diario-home-preview .diary-circle{display:flex;width:min(24vw,135px);height:min(24vw,135px);max-width:135px;max-height:135px;border-radius:50%;margin:0 auto 13px;align-items:center;justify-content:center;font-size:clamp(30px,8vw,54px)}
#diario-home-preview .diary-icon:nth-child(1) .diary-circle{background:#e7eee5}
#diario-home-preview .diary-icon:nth-child(2) .diary-circle{background:#e9ede9}
#diario-home-preview .diary-icon:nth-child(3) .diary-circle{background:#f2ece4}
#diario-home-preview .diary-explore{border:0;background:#7c9480;color:white;border-radius:28px;padding:14px 42px;margin-top:36px;font:inherit;cursor:pointer}
`;d.head.appendChild(style);
const section=d.createElement('section');section.id='diario-home-preview';section.innerHTML='<h2>Diário de Consultório</h2><div class="diary-icons"><button class="diary-icon"><span class="diary-circle">✧</span>Casos clínicos</button><button class="diary-icon"><span class="diary-circle">☕</span>Bastidores</button><button class="diary-icon"><span class="diary-circle">✎</span>Reflexões</button></div><button class="diary-explore">Explorar</button>';
const hero=d.querySelector('.hero')||d.querySelector('main')||d.querySelector('header');if(hero)hero.insertAdjacentElement('afterend',section);else d.body.prepend(section);
section.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{window.location.href='/diario-previa-iphone.html'}));
}catch(e){document.querySelector('.status').textContent='Prévia indisponível temporariamente; o site oficial continua preservado';}
});
</script></body></html>
