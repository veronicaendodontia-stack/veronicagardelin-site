name: Atualizar publicações do Diário
on:
  push:
    branches: [main]
    paths:
      - 'diario/publicacoes/*.yaml'
      - 'diario/publicacoes/*.yml'
      - 'scripts/gerar_indice_diario.py'
      - '.github/workflows/diario-publicacoes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.2'
      - run: python scripts/gerar_indice_diario.py
      - name: Salvar índice
        run: |
          if ! git diff --quiet -- diario/publicacoes.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add diario/publicacoes.json
            git commit -m "Atualizar índice público do Diário"
            git push
          fi
