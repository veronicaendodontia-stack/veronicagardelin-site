name: Verificar publicações do Diário (testes)
on:
  push:
    branches:
      - teste-diario-de-consultorio
    paths:
      - 'scripts/gerar_indice_diario.py'
      - 'tests/test_gerar_indice_diario.py'
      - '.github/workflows/diario-testes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependência
        run: python -m pip install 'PyYAML==6.0.2'
      - name: Executar testes
        run: python -m unittest discover -s tests -p 'test_gerar_indice_diario.py' -v
