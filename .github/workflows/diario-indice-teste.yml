name: Atualizar índice do Diário (testes)
on:
  push:
    branches:
      - teste-diario-de-consultorio
    paths:
      - 'diario/publicacoes/*.yaml'
      - 'diario/publicacoes/*.yml'
      - 'scripts/gerar_indice_diario.py'
      - '.github/workflows/diario-indice-teste.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar-indice:
    runs-on: ubuntu-latest
    steps:
      - name: Obter branch de testes
        uses: actions/checkout@v4
        with:
          ref: teste-diario-de-consultorio
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar leitor YAML
        run: python -m pip install 'PyYAML==6.0.2'
      - name: Gerar índice público apenas na branch de testes
        run: python scripts/gerar_indice_diario.py
      - name: Salvar índice se houver alteração
        run: |
          if ! git diff --quiet -- diario/publicacoes.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add diario/publicacoes.json
            git commit -m "Atualizar índice do Diário na branch de testes"
            git push origin HEAD:teste-diario-de-consultorio
          fi
